<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社团成员管理</title>
  <style>
     * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 480px; margin: 24px auto; padding: 0 16px; }
    li.done { text-decoration: line-through; color: #999; }
    .del { margin-left: 12px; cursor: pointer; }
    .tip { color: #c00; font-size: 14px; min-height: 20px; }
    .filters { margin: 12px 0; }
    .filters button { margin-right: 8px; }
  </style>
</head>
<body>
  <h1>社团成员管理</h1>
  <form id="add-form">
    <div class="form-row">
      <input type="text" id="name-input" placeholder="姓名">
      <input type="text" id="id-input" placeholder="学号">
      <input type="text" id="grade-input" placeholder="年级">
      <button type="submit">添加</button>
    </div>
  </form>
  <p class="tip" id="tip"></p>
  <table>
    <thead>
      <tr><th>姓名</th><th>学号</th><th>年级</th><th>操作</th></tr>
    </thead>
    <tbody id="member-list"></tbody>
  </table>
  <script src="CM.js"></script>
</body>
</html>
